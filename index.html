<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Nourhene ✨</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Georgia,"Times New Roman",serif;overflow:hidden}
body{background:#050817;color:#fff}
#stars{position:fixed;inset:0;overflow:hidden}
.bgstar{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.55;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 1s}
.screen.active{opacity:1;pointer-events:auto}
.card{text-align:center;width:min(92vw,520px)}
#intro h1{font-size:clamp(42px,13vw,76px);font-weight:400;letter-spacing:5px;margin:0 0 35px;text-shadow:0 0 25px #fff}
.subtitle{font-size:14px;letter-spacing:4px;opacity:.65}
.constellation{height:150px;position:relative;margin:10px auto 0;width:min(90vw,420px)}
.mainstar{position:absolute;top:50px;width:18px;height:18px;transform:rotate(45deg);background:#fff;box-shadow:0 0 15px 5px #fff;opacity:0}
.mainstar:after,.mainstar:before{content:"";position:absolute;inset:-10px;background:linear-gradient(90deg,transparent 48%,#fff 50%,transparent 52%);opacity:.55}
.mainstar:before{transform:rotate(90deg)}
.mainstar.s1{left:10%;animation:appear 1s .7s forwards, glow 2.5s 1.7s infinite}
.mainstar.s2{left:calc(50% - 9px);animation:appear 1s 1.2s forwards, glow 2.5s 2.2s infinite}
.mainstar.s3{right:10%;animation:appear 1s 1.7s forwards, glow 2.5s 2.7s infinite}
@keyframes appear{to{opacity:1}}
@keyframes glow{50%{filter:brightness(1.7);transform:rotate(45deg) scale(1.2)}}
.nicknames{display:flex;justify-content:space-between;margin:0 auto;width:min(90vw,420px);font-size:14px;letter-spacing:2px;opacity:0;animation:fade 1.5s 2.5s forwards}
.nicknames span{width:30%}.nicknames span:nth-child(2){margin-top:-4px}
@keyframes fade{to{opacity:.9}}
button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:18px;padding:15px 22px;font-size:16px;font-family:inherit;cursor:pointer;transition:.25s}
button:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
#startBtn{margin-top:30px;opacity:0;animation:fade 1s 3.5s forwards}
#quiz .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);padding:35px 22px;border-radius:28px;backdrop-filter:blur(8px)}
.progress{font-size:12px;letter-spacing:3px;opacity:.55;margin-bottom:25px}
.question{font-size:clamp(24px,7vw,34px);margin-bottom:28px}
.answers{display:grid;gap:12px}
.answer{width:100%;background:rgba(255,255,255,.07)}
.feedback{height:25px;margin-top:18px;font-size:14px;opacity:0;transition:.3s}
.feedback.show{opacity:.8}
#final h2{font-size:clamp(36px,11vw,62px);font-weight:400;margin:0 0 25px;text-shadow:0 0 20px #fff}
.finalmsg{font-size:19px;line-height:1.8;opacity:.9}
.mini{font-size:13px;letter-spacing:2px;opacity:.55;margin-top:28px}
</style>
</head>
<body>
<div id="stars"></div>

<section id="intro" class="screen active">
  <div class="card">
    <div class="subtitle">UNE PETITE EXPÉRIENCE POUR</div>
    <h1>Nourhene</h1>
    <div class="constellation">
      <span class="mainstar s1"></span><span class="mainstar s2"></span><span class="mainstar s3"></span>
    </div>
    <div class="nicknames"><span>Lymouna</span><span>Queen</span><span>Ma3dnousa</span></div>
    <button id="startBtn">Entrer dans les étoiles ✨</button>
  </div>
</section>

<section id="quiz" class="screen">
  <div class="card">
    <div class="progress" id="progress">QUESTION 1 / 3</div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<section id="final" class="screen">
  <div class="card">
    <div class="constellation">
      <span class="mainstar s1" style="opacity:1"></span>
      <span class="mainstar s2" style="opacity:1"></span>
      <span class="mainstar s3" style="opacity:1"></span>
    </div>
    <h2>Nourhene ✨</h2>
    <div class="finalmsg">
      Certaines étoiles brillent dans le ciel.<br>
      Et puis il y en a qui rendent une histoire spéciale.
    </div>
    <div class="mini">Lymouna • Queen • Ma3dnousa</div>
  </div>
</section>

<script>
const bg=document.getElementById("stars");
for(let i=0;i<90;i++){let s=document.createElement("i");s.className="bgstar";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*3+"s";bg.appendChild(s)}
const questions=[
 {q:"Quel est ton prénom ?",a:["Nourhene","Yasmine","Mariem"],correct:0},
 {q:"Quel âge as-tu ?",a:["16","17","18"],correct:2},
 {q:"Qu’est-ce que tu aimes le plus ?",a:["Les fleurs","Les étoiles ✨","La mer"],correct:1}
];
let index=0;
const intro=document.getElementById("intro"),quiz=document.getElementById("quiz"),final=document.getElementById("final");
const q=document.getElementById("question"),answers=document.getElementById("answers"),feedback=document.getElementById("feedback"),progress=document.getElementById("progress");
function showQuiz(){intro.classList.remove("active");setTimeout(()=>{quiz.classList.add("active");render()},500)}
document.getElementById("startBtn").onclick=showQuiz;
function render(){
 progress.textContent=`QUESTION ${index+1} / 3`; q.textContent=questions[index].q; answers.innerHTML=""; feedback.className="feedback"; feedback.textContent="";
 questions[index].a.forEach((x,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>choose(i);answers.appendChild(b)})
}
function choose(i){
 [...answers.children].forEach(b=>b.disabled=true);
 const ok=i===questions[index].correct;
 feedback.textContent=ok?"✨ Exactement…":"✨ Intéressant…";
 feedback.classList.add("show");
 setTimeout(()=>{
  index++;
  if(index<questions.length) render();
  else {quiz.classList.remove("active");setTimeout(()=>final.classList.add("active"),450)}
 },900);
}
</script>
</body>
</html>
